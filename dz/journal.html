<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал Вчителя - ДЗ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 12px 25px;
            background: #e0e6ed;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .tab-btn:hover {
            background: #d1d8e0;
        }
        .tab-btn.active {
            background: #3498db;
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        input, select, button {
            padding: 10px 15px;
            font-size: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }
        button {
            background: #2ecc71;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #27ae60;
        }
        .btn-blue {
            background: #3498db;
        }
        .btn-blue:hover {
            background: #2980b9;
        }
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .class-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .class-header h3 {
            margin: 0;
            color: #2c3e50;
        }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #e9ecef;
            border-radius: 5px;
        }
        .btn-delete {
            background: #e74c3c;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
        }
        .btn-delete:hover {
            background: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #fff;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .status-done {
            color: #27ae60;
            font-weight: bold;
        }
        .status-missing {
            color: #e74c3c;
            font-weight: bold;
        }
        .group-header {
            background-color: #e0e6ed;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Журнал Вчителя</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('reports')">📊 Звіти ДЗ</button>
        <button class="tab-btn" onclick="switchTab('students')">👥 Учні та Класи</button>
    </div>

    <!-- Вкладка Звітів -->
    <div id="tab-reports" class="tab-content active">
        <div class="control-group">
            <input type="date" id="report-date" title="Оберіть дату">
            <input type="text" id="report-game" placeholder="Назва файлу гри (ID)" title="Введіть ID гри">
            <select id="report-category">
                <option value="all">Всі учні (всі класи)</option>
                <option value="individual">Тільки Індивідуальні</option>
            </select>
            <button onclick="loadReports()">🔍 Шукати звіти</button>
        </div>
        <div id="reports-output">
            <p style="text-align: center; color: #7f8c8d; font-size: 18px; margin-top: 30px;">Оберіть дату та гру для перегляду результатів.</p>
        </div>
    </div>

    <!-- Вкладка Учнів -->
    <div id="tab-students" class="tab-content">
        
        <div class="control-group">
            <input type="text" id="new-class-name" placeholder="Назва нового класу (напр. 5-А)">
            <button class="btn-blue" onclick="addClass()">➕ Створити клас</button>
        </div>

        <div class="control-group">
            <input type="text" id="new-student-name" placeholder="Ім'я учня">
            <select id="new-student-category">
                <option value="individual">Індивідуально</option>
            </select>
            <button onclick="addStudent()">➕ Додати учня</button>
        </div>

        <div class="students-grid" id="classes-container">
            <!-- Сюди будуть генеруватися блоки з класами та індивідуальними учнями -->
        </div>
    </div>
</div>

<script>
    // Ініціалізація Firebase (ваш проект)
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com",
        projectId: "lesson-13c44"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Встановлюємо сьогоднішню дату за замовчуванням
    document.getElementById('report-date').valueAsDate = new Date();

    let classesData = {}; 
    let studentsData = { individual: {} };

    // 1. Завантаження даних про класи та учнів
    function loadSchoolData() {
        db.ref('journal_classes').on('value', (snapshot) => {
            classesData = snapshot.val() || {};
            updateSelectDropdowns();
            renderStudentsUI();
        });

        db.ref('journal_students').on('value', (snapshot) => {
            studentsData = snapshot.val() || { individual: {} };
            if (!studentsData.individual) studentsData.individual = {};
            renderStudentsUI();
        });
    }

    // 2. Оновлення випадаючих списків
    function updateSelectDropdowns() {
        const studentSelect = document.getElementById('new-student-category');
        const reportSelect = document.getElementById('report-category');
        
        const currentStudentVal = studentSelect.value;
        const currentReportVal = reportSelect.value;

        studentSelect.innerHTML = `<option value="individual">Індивідуально</option>`;
        reportSelect.innerHTML = `<option value="all">Всі учні (всі класи)</option><option value="individual">Тільки Індивідуальні</option>`;

        Object.keys(classesData).forEach(classId => {
            const className = classesData[classId].name;
            studentSelect.innerHTML += `<option value="${classId}">${className}</option>`;
            reportSelect.innerHTML += `<option value="${classId}">${className}</option>`;
        });

        if (document.querySelector(`#new-student-category option[value="${currentStudentVal}"]`)) {
            studentSelect.value = currentStudentVal;
        }
        if (document.querySelector(`#report-category option[value="${currentReportVal}"]`)) {
            reportSelect.value = currentReportVal;
        }
    }

    // 3. Відмальовка блоків класів
    function renderStudentsUI() {
        const container = document.getElementById('classes-container');
        container.innerHTML = '';

        let individualHtml = `<div class="class-section">
            <div class="class-header">
                <h3>👤 Індивідуальні учні</h3>
            </div>
            <div id="list-individual">`;
        
        if (studentsData.individual) {
            Object.keys(studentsData.individual).forEach(studentId => {
                individualHtml += `<div class="student-item">
                    <span>${studentsData.individual[studentId]}</span>
                    <button class="btn-delete" onclick="deleteStudent('individual', '${studentId}')">Видалити</button>
                </div>`;
            });
        }
        individualHtml += `</div></div>`;
        container.innerHTML += individualHtml;

        Object.keys(classesData).forEach(classId => {
            const className = classesData[classId].name;
            let classHtml = `<div class="class-section">
                <div class="class-header">
                    <h3>👥 ${className}</h3>
                    <button class="btn-delete" onclick="deleteClass('${classId}', '${className}')">Видалити клас</button>
                </div>
                <div id="list-${classId}">`;
            
            if (studentsData[classId]) {
                Object.keys(studentsData[classId]).forEach(studentId => {
                    classHtml += `<div class="student-item">
                        <span>${studentsData[classId][studentId]}</span>
                        <button class="btn-delete" onclick="deleteStudent('${classId}', '${studentId}')">Видалити</button>
                    </div>`;
                });
            } else {
                classHtml += `<p style="color:#7f8c8d; font-size:14px;">Немає учнів</p>`;
            }
            
            classHtml += `</div></div>`;
            container.innerHTML += classHtml;
        });
    }

    function addClass() {
        const input = document.getElementById('new-class-name');
        const className = input.value.trim();
        if (className === "") return alert("Введіть назву класу!");

        db.ref('journal_classes').push({ name: className }).then(() => { input.value = ''; });
    }

    function deleteClass(classId, className) {
        if (confirm(`Ви впевнені, що хочете видалити "${className}" та всіх його учнів?`)) {
            db.ref(`journal_classes/${classId}`).remove();
            db.ref(`journal_students/${classId}`).remove(); 
        }
    }

    function addStudent() {
        const input = document.getElementById('new-student-name');
        const categoryId = document.getElementById('new-student-category').value;
        const studentName = input.value.trim();

        if (studentName === "") return alert("Введіть ім'я учня!");

        db.ref(`journal_students/${categoryId}`).push(studentName).then(() => { input.value = ''; });
    }

    function deleteStudent(categoryId, studentId) {
        if (confirm("Видалити цього учня?")) {
            db.ref(`journal_students/${categoryId}/${studentId}`).remove();
        }
    }

    // 6. Формування та пошук звітів (З ОНОВЛЕННЯМ ДЛЯ ГОСТЕЙ)
    function loadReports() {
        const dateVal = document.getElementById('report-date').value;
        const gameId = document.getElementById('report-game').value.trim();
        const filterId = document.getElementById('report-category').value;
        const output = document.getElementById('reports-output');

        if (!dateVal || !gameId) {
            return alert("Оберіть дату та введіть ID гри (назву)!");
        }

        const dateObj = new Date(dateVal);
        const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
        
        output.innerHTML = "<p style='text-align:center;'>Завантаження даних...</p>";

        db.ref(`homework_reports/${monthKey}/${dateVal}/${gameId}`).once('value').then(snapshot => {
            const reports = snapshot.val() || {};
            let html = `<table>
                <thead>
                    <tr>
                        <th>Ім'я учня</th>
                        <th>Статус</th>
                        <th>Бали / Результат</th>
                        <th>Помилки</th>
                        <th>Час здачі</th>
                    </tr>
                </thead>
                <tbody>`;

            let hasAnyStudents = false;
            let processedNames = new Set(); // Зберігаємо всіх, кого вже показали

            const renderGroupRows = (groupId, groupTitle) => {
                const groupStudents = studentsData[groupId];
                if (!groupStudents || Object.keys(groupStudents).length === 0) return;
                
                hasAnyStudents = true;
                if (filterId === 'all') {
                    html += `<tr><td colspan="5" class="group-header">${groupTitle}</td></tr>`;
                }

                Object.values(groupStudents).forEach(studentName => {
                    processedNames.add(studentName); // Фіксуємо, що учень зі списку перевірений
                    const report = reports[studentName];
                    if (report) {
                        html += `<tr>
                            <td>${studentName}</td>
                            <td class="status-done">✅ Виконано</td>
                            <td>${report.score !== undefined ? report.score : '-'}</td>
                            <td>${report.mistakes !== undefined ? report.mistakes : '-'}</td>
                            <td>${report.timestamp || '-'}</td>
                        </tr>`;
                    } else {
                        html += `<tr>
                            <td>${studentName}</td>
                            <td class="status-missing">❌ Не виконано</td>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                        </tr>`;
                    }
                });
            };

            if (filterId === 'all') {
                renderGroupRows('individual', 'Індивідуальні учні');
                Object.keys(classesData).forEach(classId => {
                    renderGroupRows(classId, classesData[classId].name);
                });
            } else if (filterId === 'individual') {
                renderGroupRows('individual', 'Індивідуальні учні');
            } else {
                renderGroupRows(filterId, classesData[filterId].name);
            }

            // --- НОВИЙ БЛОК: ДОДАВАННЯ ГОСТЕЙ ---
            let guestHtml = '';
            let hasGuests = false;
            
            Object.keys(reports).forEach(submittedName => {
                if (!processedNames.has(submittedName)) {
                    if (!hasGuests) {
                        guestHtml += `<tr><td colspan="5" class="group-header" style="background-color: #f39c12; color: white;">🕵️ Гості / Незареєстровані учні</td></tr>`;
                        hasGuests = true;
                        hasAnyStudents = true;
                    }
                    const report = reports[submittedName];
                    guestHtml += `<tr>
                        <td><strong>${submittedName}</strong></td>
                        <td class="status-done" style="color: #d35400;">✅ Виконано (Гість)</td>
                        <td>${report.score !== undefined ? report.score : '-'}</td>
                        <td>${report.mistakes !== undefined ? report.mistakes : '-'}</td>
                        <td>${report.timestamp || '-'}</td>
                    </tr>`;
                }
            });
            
            html += guestHtml;
            // ------------------------------------

            if (!hasAnyStudents) {
                html += `<tr><td colspan="5" style="text-align:center;">У цій категорії немає доданих учнів і немає жодного звіту.</td></tr>`;
            }

            html += `</tbody></table>`;
            output.innerHTML = html;
        });
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    loadSchoolData();
</script>
</body>
</html>

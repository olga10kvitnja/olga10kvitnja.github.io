<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал Вчителя - ДЗ (Темна Тема)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* Темний стильний дизайн */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            color: #f8fafc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        .tab-btn {
            padding: 12px 25px;
            background: #334155;
            color: #94a3b8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab-btn:hover {
            background: #475569;
            color: #f8fafc;
        }
        .tab-btn.active {
            background: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
            background: #0f172a;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        input, select, button {
            padding: 12px 18px;
            font-size: 15px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #1e293b;
            color: #f8fafc;
        }
        input::placeholder {
            color: #64748b;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        button {
            background: #10b981;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #059669;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .btn-blue {
            background: #3b82f6;
        }
        .btn-blue:hover {
            background: #2563eb;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .class-section {
            background: #0f172a;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }
        .class-header h3 {
            margin: 0;
            color: #38bdf8;
        }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #334155;
            border-radius: 6px;
        }
        .btn-delete {
            background: #ef4444;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 4px;
        }
        .btn-delete:hover {
            background: #dc2828;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #334155;
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
        }
        tr:nth-child(even) {
            background-color: #0f172a;
        }
        tr:hover {
            background-color: #334155;
        }
        .details-cell {
            color: #94a3b8;
            font-size: 14px;
            white-space: pre-wrap; /* Зберігає перенесення рядків */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Журнал Вчителя (ДЗ)</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('reports')">📊 Звіти ДЗ та Пошук</button>
        <button class="tab-btn" onclick="switchTab('students')">👥 Учні та Класи</button>
    </div>

    <!-- Вкладка Звітів та Пошуку -->
    <div id="tab-reports" class="tab-content active">
        <div class="control-group">
            <input type="text" id="search-student" placeholder="Ім'я учня (або порожньо для всіх)" style="flex: 1;">
            <input type="text" id="search-game" placeholder="ID гри (або порожньо для всіх)" style="flex: 1;">
            <select id="report-category">
                <option value="all">Всі категорії</option>
                <option value="individual">Тільки Індивідуальні</option>
                <!-- Динамічні класи додадуться сюди -->
            </select>
            <button onclick="loadReports()" class="btn-blue">🔍 Знайти роботи</button>
        </div>
        <div id="reports-output">
            <p style="text-align: center; color: #64748b; font-size: 18px; margin-top: 30px;">Введіть параметри пошуку або просто натисніть "Знайти роботи", щоб побачити все.</p>
        </div>
    </div>

    <!-- Вкладка Учнів -->
    <div id="tab-students" class="tab-content">
        
        <div class="control-group">
            <input type="text" id="new-class-name" placeholder="Назва нового класу (напр. 5-А)">
            <button class="btn-blue" onclick="addClass()">➕ Створити клас</button>
        </div>

        <div class="control-group">
            <input type="text" id="new-student-name" placeholder="Ім'я учня">
            <select id="new-student-category">
                <option value="individual">Індивідуально</option>
            </select>
            <button onclick="addStudent()">➕ Додати учня</button>
        </div>

        <div class="students-grid" id="classes-container">
            <!-- Сюди будуть генеруватися блоки з класами та індивідуальними учнями -->
        </div>
    </div>
</div>

<script>
    // Ініціалізація Firebase (ваш проект)
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com",
        projectId: "lesson-13c44"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let classesData = {}; 
    let studentsData = { individual: {} };

    // 1. Завантаження даних про класи та учнів
    function loadSchoolData() {
        db.ref('journal_classes').on('value', (snapshot) => {
            classesData = snapshot.val() || {};
            updateSelectDropdowns();
            renderStudentsUI();
        });

        db.ref('journal_students').on('value', (snapshot) => {
            studentsData = snapshot.val() || { individual: {} };
            if (!studentsData.individual) studentsData.individual = {};
            renderStudentsUI();
        });
    }

    // 2. Оновлення випадаючих списків
    function updateSelectDropdowns() {
        const studentSelect = document.getElementById('new-student-category');
        const reportSelect = document.getElementById('report-category');
        
        const currentStudentVal = studentSelect.value;
        const currentReportVal = reportSelect.value;

        studentSelect.innerHTML = `<option value="individual">Індивідуально</option>`;
        reportSelect.innerHTML = `<option value="all">Всі категорії</option><option value="individual">Тільки Індивідуальні</option>`;

        Object.keys(classesData).forEach(classId => {
            const className = classesData[classId].name;
            studentSelect.innerHTML += `<option value="${classId}">${className}</option>`;
            reportSelect.innerHTML += `<option value="${classId}">${className}</option>`;
        });

        if (document.querySelector(`#new-student-category option[value="${currentStudentVal}"]`)) {
            studentSelect.value = currentStudentVal;
        }
        if (document.querySelector(`#report-category option[value="${currentReportVal}"]`)) {
            reportSelect.value = currentReportVal;
        }
    }

    // 3. Відмальовка блоків класів
    function renderStudentsUI() {
        const container = document.getElementById('classes-container');
        container.innerHTML = '';

        let individualHtml = `<div class="class-section">
            <div class="class-header">
                <h3>👤 Індивідуальні учні</h3>
            </div>
            <div id="list-individual">`;
        
        if (studentsData.individual) {
            Object.keys(studentsData.individual).forEach(studentId => {
                individualHtml += `<div class="student-item">
                    <span>${studentsData.individual[studentId]}</span>
                    <button class="btn-delete" onclick="deleteStudent('individual', '${studentId}')">Видалити</button>
                </div>`;
            });
        }
        individualHtml += `</div></div>`;
        container.innerHTML += individualHtml;

        Object.keys(classesData).forEach(classId => {
            const className = classesData[classId].name;
            let classHtml = `<div class="class-section">
                <div class="class-header">
                    <h3>👥 ${className}</h3>
                    <button class="btn-delete" onclick="deleteClass('${classId}', '${className}')">Видалити клас</button>
                </div>
                <div id="list-${classId}">`;
            
            if (studentsData[classId]) {
                Object.keys(studentsData[classId]).forEach(studentId => {
                    classHtml += `<div class="student-item">
                        <span>${studentsData[classId][studentId]}</span>
                        <button class="btn-delete" onclick="deleteStudent('${classId}', '${studentId}')">Видалити</button>
                    </div>`;
                });
            } else {
                classHtml += `<p style="color:#64748b; font-size:14px;">Немає учнів</p>`;
            }
            
            classHtml += `</div></div>`;
            container.innerHTML += classHtml;
        });
    }

    function addClass() {
        const input = document.getElementById('new-class-name');
        const className = input.value.trim();
        if (className === "") return alert("Введіть назву класу!");
        db.ref('journal_classes').push({ name: className }).then(() => { input.value = ''; });
    }

    function deleteClass(classId, className) {
        if (confirm(`Ви впевнені, що хочете видалити "${className}" та всіх його учнів?`)) {
            db.ref(`journal_classes/${classId}`).remove();
            db.ref(`journal_students/${classId}`).remove(); 
        }
    }

    function addStudent() {
        const input = document.getElementById('new-student-name');
        const categoryId = document.getElementById('new-student-category').value;
        const studentName = input.value.trim();
        if (studentName === "") return alert("Введіть ім'я учня!");
        db.ref(`journal_students/${categoryId}`).push(studentName).then(() => { input.value = ''; });
    }

    function deleteStudent(categoryId, studentId) {
        if (confirm("Видалити цього учня зі списку?")) {
            db.ref(`journal_students/${categoryId}/${studentId}`).remove();
        }
    }

    // 4. ГЛОБАЛЬНИЙ ПОШУК ТА ВІДОБРАЖЕННЯ ЗВІТІВ
    function loadReports() {
        const studentQ = document.getElementById('search-student').value.trim().toLowerCase();
        const gameQ = document.getElementById('search-game').value.trim().toLowerCase();
        const filterId = document.getElementById('report-category').value;
        const output = document.getElementById('reports-output');

        output.innerHTML = "<p style='text-align:center; color: #38bdf8;'>Завантаження даних...</p>";

        db.ref('homework_reports').once('value').then(snapshot => {
            const allData = snapshot.val() || {};
            let html = `<table>
                <thead>
                    <tr>
                        <th>Дата та Час</th>
                        <th>Гра (ID)</th>
                        <th>Ім'я учня</th>
                        <th>Бали</th>
                        <th>Помилки</th>
                        <th>Деталі роботи (Відповіді)</th>
                        <th>Дії</th>
                    </tr>
                </thead>
                <tbody>`;

            let resultCount = 0;

            // Перебираємо всю базу: місяць -> дата -> гра -> учень
            for (const month in allData) {
                for (const date in allData[month]) {
                    for (const gameId in allData[month][date]) {
                        
                        // Фільтр по грі
                        if (gameQ && !gameId.toLowerCase().includes(gameQ)) continue;

                        for (const studentName in allData[month][date][gameId]) {
                            
                            // Фільтр по імені учня
                            if (studentQ && !studentName.toLowerCase().includes(studentQ)) continue;

                            // Фільтр по категорії (класу)
                            if (filterId !== 'all') {
                                let belongsToCategory = false;
                                if (filterId === 'individual' && studentsData.individual && Object.values(studentsData.individual).includes(studentName)) {
                                    belongsToCategory = true;
                                } else if (studentsData[filterId] && Object.values(studentsData[filterId]).includes(studentName)) {
                                    belongsToCategory = true;
                                }
                                if (!belongsToCategory) continue; // Пропускаємо, якщо не в цій категорії
                            }

                            const report = allData[month][date][gameId][studentName];
                            resultCount++;
                            
                            html += `<tr>
                                <td>${date} <br><small style="color:#94a3b8">${report.timestamp || ''}</small></td>
                                <td style="color:#38bdf8;">${gameId}</td>
                                <td style="font-size: 16px; font-weight: bold; color: #f8fafc;">${studentName}</td>
                                <td><span style="color:#10b981; font-weight:bold;">${report.score || '-'}</span></td>
                                <td><span style="color:#ef4444; font-weight:bold;">${report.mistakes !== undefined ? report.mistakes : '-'}</span></td>
                                <td class="details-cell">${report.details || 'Немає деталей'}</td>
                                <td>
                                    <button class="btn-delete" onclick="deleteReportRecord('${month}', '${date}', '${gameId}', '${studentName}')">🗑️ Видалити</button>
                                </td>
                            </tr>`;
                        }
                    }
                }
            }

            if (resultCount === 0) {
                html += `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">За вашим запитом нічого не знайдено.</td></tr>`;
            }

            html += `</tbody></table>`;
            output.innerHTML = html;
        });
    }

    // 5. ВИДАЛЕННЯ ЗВІТУ З БАЗИ
    function deleteReportRecord(month, date, gameId, studentName) {
        if (confirm(`Ви впевнені, що хочете видалити роботу учня "${studentName}" за гру "${gameId}"?`)) {
            db.ref(`homework_reports/${month}/${date}/${gameId}/${studentName}`).remove().then(() => {
                // Оновлюємо пошук після видалення
                loadReports();
            }).catch(err => {
                alert("Помилка при видаленні: " + err.message);
            });
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    loadSchoolData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал Вчителя - ДЗ (Темна Тема)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            color: #f8fafc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        .tab-btn {
            padding: 12px 25px;
            background: #334155;
            color: #94a3b8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab-btn:hover {
            background: #475569;
            color: #f8fafc;
        }
        .tab-btn.active {
            background: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
            background: #0f172a;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        input, select, button {
            padding: 12px 18px;
            font-size: 15px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #1e293b;
            color: #f8fafc;
        }
        input::placeholder { color: #64748b; }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        button {
            background: #10b981;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #059669;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .btn-blue { background: #3b82f6; }
        .btn-blue:hover { background: #2563eb; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .class-section {
            background: #0f172a;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }
        .class-header h3 { margin: 0; color: #38bdf8; }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #334155;
            border-radius: 6px;
        }
        .btn-group {
            display: flex;
            gap: 5px;
        }
        .btn-delete {
            background: #ef4444;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 4px;
        }
        .btn-delete:hover {
            background: #dc2828;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }
        .btn-edit {
            background: #f59e0b;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 4px;
        }
        .btn-edit:hover {
            background: #d97706;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #334155;
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
        }
        tr:nth-child(even) { background-color: #0f172a; }
        tr:hover { background-color: #334155; }
        
        .game-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .game-link:hover { color: #818cf8; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Журнал Вчителя (ДЗ)</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('reports')">📊 Звіти ДЗ та Пошук</button>
        <button class="tab-btn" onclick="switchTab('students')">👥 Учні та Класи</button>
    </div>

    <!-- Вкладка Звітів та Пошуку -->
    <div id="tab-reports" class="tab-content active">
        <div class="control-group">
            <datalist id="students-datalist"></datalist>
            <input type="text" id="search-student" list="students-datalist" placeholder="Ім'я учня (оберіть або введіть...)" style="flex: 1;">
            
            <input type="text" id="search-game" placeholder="Назва гри (або порожньо для всіх)" style="flex: 1;">
            
            <select id="report-category">
                <option value="all">Всі категорії (всі класи)</option>
                <option value="individual">Тільки Індивідуальні</option>
            </select>
            <button onclick="loadReports()" class="btn-blue">🔍 Знайти роботи</button>
        </div>
        <div id="reports-output">
            <p style="text-align: center; color: #64748b; font-size: 18px; margin-top: 30px;">Введіть ім'я учня, назву гри або оберіть клас, а потім натисніть "Знайти роботи".</p>
        </div>
    </div>

    <!-- Вкладка Учнів -->
    <div id="tab-students" class="tab-content">
        <div class="control-group">
            <input type="text" id="new-class-name" placeholder="Назва нового класу (напр. 5-А)">
            <button class="btn-blue" onclick="addClass()">➕ Створити клас</button>
        </div>
        <div class="control-group">
            <input type="text" id="new-student-name" placeholder="Ім'я учня">
            <select id="new-student-category">
                <option value="individual">Індивідуально</option>
            </select>
            <button onclick="addStudent()">➕ Додати учня</button>
        </div>
        <div class="students-grid" id="classes-container"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com",
        projectId: "lesson-13c44"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let classesData = {}; 
    let studentsData = { individual: {} };

    function loadSchoolData() {
        db.ref('journal_classes').on('value', (snapshot) => {
            classesData = snapshot.val() || {};
            updateSelectDropdowns();
            renderStudentsUI();
        });
        db.ref('journal_students').on('value', (snapshot) => {
            studentsData = snapshot.val() || { individual: {} };
            if (!studentsData.individual) studentsData.individual = {};
            updateSelectDropdowns();
            renderStudentsUI();
        });
    }

    function updateSelectDropdowns() {
        const studentSelect = document.getElementById('new-student-category');
        const reportSelect = document.getElementById('report-category');
        const currentStudentVal = studentSelect.value;
        const currentReportVal = reportSelect.value;

        studentSelect.innerHTML = `<option value="individual">Індивідуально</option>`;
        reportSelect.innerHTML = `<option value="all">Всі категорії (всі класи)</option><option value="individual">Тільки Індивідуальні</option>`;

        Object.keys(classesData).forEach(classId => {
            const className = classesData[classId].name;
            studentSelect.innerHTML += `<option value="${classId}">${className}</option>`;
            reportSelect.innerHTML += `<option value="${classId}">${className}</option>`;
        });

        if (document.querySelector(`#new-student-category option[value="${currentStudentVal}"]`)) studentSelect.value = currentStudentVal;
        if (document.querySelector(`#report-category option[value="${currentReportVal}"]`)) reportSelect.value = currentReportVal;

        // Оновлюємо випадаючий список імен (datalist)
        const datalist = document.getElementById('students-datalist');
        if (datalist) {
            datalist.innerHTML = '';
            let allStudentsNames = new Set();
            if (studentsData.individual) Object.values(studentsData.individual).forEach(n => allStudentsNames.add(n));
            Object.keys(classesData).forEach(classId => {
                if (studentsData[classId]) Object.values(studentsData[classId]).forEach(n => allStudentsNames.add(n));
            });
            allStudentsNames.forEach(name => {
                datalist.innerHTML += `<option value="${name}">`;
            });
        }
    }

    function renderStudentsUI() {
        const container = document.getElementById('classes-container');
        container.innerHTML = '';
        let individualHtml = `<div class="class-section"><div class="class-header"><h3>👤 Індивідуальні учні</h3></div><div id="list-individual">`;
        if (studentsData.individual) {
            Object.values(studentsData.individual).sort((a,b) => a.localeCompare(b)).forEach(studentName => {
                const studentId = Object.keys(studentsData.individual).find(key => studentsData.individual[key] === studentName);
                individualHtml += `<div class="student-item">
                    <span>${studentName}</span>
                    <div class="btn-group">
                        <button class="btn-edit" onclick="editStudent('individual', '${studentId}', '${studentName}')">✏️</button>
                        <button class="btn-delete" onclick="deleteStudent('individual', '${studentId}')">🗑️</button>
                    </div>
                </div>`;
            });
        }
        individualHtml += `</div></div>`;
        container.innerHTML += individualHtml;

        // Сортування класів за алфавітом
        Object.keys(classesData).sort((a,b) => classesData[a].name.localeCompare(classesData[b].name)).forEach(classId => {
            const className = classesData[classId].name;
            let classHtml = `<div class="class-section"><div class="class-header"><h3>👥 ${className}</h3><button class="btn-delete" onclick="deleteClass('${classId}', '${className}')">Видалити клас</button></div><div id="list-${classId}">`;
            if (studentsData[classId]) {
                Object.values(studentsData[classId]).sort((a,b) => a.localeCompare(b)).forEach(studentName => {
                    const studentId = Object.keys(studentsData[classId]).find(key => studentsData[classId][key] === studentName);
                    classHtml += `<div class="student-item">
                        <span>${studentName}</span>
                        <div class="btn-group">
                            <button class="btn-edit" onclick="editStudent('${classId}', '${studentId}', '${studentName}')">✏️</button>
                            <button class="btn-delete" onclick="deleteStudent('${classId}', '${studentId}')">🗑️</button>
                        </div>
                    </div>`;
                });
            } else {
                classHtml += `<p style="color:#64748b; font-size:14px;">Немає учнів</p>`;
            }
            classHtml += `</div></div>`;
            container.innerHTML += classHtml;
        });
    }

    function addClass() {
        const input = document.getElementById('new-class-name');
        const className = input.value.trim();
        if (className === "") return alert("Введіть назву класу!");
        db.ref('journal_classes').push({ name: className }).then(() => { input.value = ''; });
    }

    function deleteClass(classId, className) {
        if (confirm(`Ви впевнені, що хочете видалити "${className}" та всіх його учнів?`)) {
            db.ref(`journal_classes/${classId}`).remove();
            db.ref(`journal_students/${classId}`).remove(); 
        }
    }

    function addStudent() {
        const input = document.getElementById('new-student-name');
        const categoryId = document.getElementById('new-student-category').value;
        const studentName = input.value.trim();
        if (studentName === "") return alert("Введіть ім'я учня!");
        db.ref(`journal_students/${categoryId}`).push(studentName).then(() => { input.value = ''; });
    }

    function deleteStudent(categoryId, studentId) {
        if (confirm("Видалити цього учня зі списку?")) db.ref(`journal_students/${categoryId}/${studentId}`).remove();
    }

    // --- НОВА ФУНКЦІЯ: ПЕРЕЙМЕНУВАННЯ УЧНЯ З ОНОВЛЕННЯМ УСІХ ЗВІТІВ ---
    function editStudent(categoryId, studentId, oldName) {
        const newName = prompt(`Введіть нове ім'я для "${oldName}"\n(Усі попередні роботи зі старим іменем також будуть прив'язані до нового імені):`, oldName);
        
        if (!newName || newName.trim() === "" || newName === oldName) return;
        const cleanNewName = newName.trim();

        // 1. Оновлюємо ім'я у списку класу
        db.ref(`journal_students/${categoryId}/${studentId}`).set(cleanNewName).then(() => {
            // 2. Скануємо всю базу звітів і переносимо роботи зі старого імені на нове
            db.ref('homework_reports').once('value').then(snapshot => {
                const allData = snapshot.val() || {};
                let updates = {};

                for (const month in allData) {
                    for (const date in allData[month]) {
                        for (const gameId in allData[month][date]) {
                            if (allData[month][date][gameId][oldName]) {
                                // Беремо дані старої роботи
                                const reportData = allData[month][date][gameId][oldName];
                                // Записуємо їх під новим іменем
                                updates[`homework_reports/${month}/${date}/${gameId}/${cleanNewName}`] = reportData;
                                // Видаляємо стару гілку
                                updates[`homework_reports/${month}/${date}/${gameId}/${oldName}`] = null;
                            }
                        }
                    }
                }

                // Виконуємо всі оновлення звітів одним пакетом (якщо вони є)
                if (Object.keys(updates).length > 0) {
                    db.ref().update(updates).then(() => {
                        alert(`Ім'я успішно змінено на "${cleanNewName}"! Усі старі роботи також оновлено.`);
                        loadReports(); // Оновлюємо таблицю, якщо вона відкрита
                    }).catch(err => alert("Помилка оновлення робіт: " + err.message));
                }
            });
        }).catch(err => alert("Помилка зміни імені: " + err.message));
    }

    function buildRow(date, gameId, studentName, report, month, isGuest=false) {
        let scoreText = report.score ? (report.score.includes("Вірно") ? report.score : "Вірно " + report.score) : '-';
        const gameUrl = `${gameId}.html?reportUser=${encodeURIComponent(studentName)}&reportDate=${date}`;
        let guestTag = isGuest ? `<span style="font-size:12px; color:#f59e0b; display:block;">(Гість / Поза класом)</span>` : '';
        
        return `<tr>
            <td>${date} <br><small style="color:#94a3b8">${report.timestamp || ''}</small></td>
            <td><a href="${gameUrl}" target="_blank" class="game-link">🎮 ${gameId}</a></td>
            <td style="font-size: 16px; font-weight: bold; color: #f8fafc;">${studentName} ${guestTag}</td>
            <td><span style="color:#10b981; font-weight:bold; font-size:16px;">${scoreText}</span></td>
            <td>
                <button class="btn-delete" onclick="deleteReportRecord('${month}', '${date}', '${gameId}', '${studentName}')">🗑️ Видалити</button>
            </td>
        </tr>`;
    }

    function buildMissingRow(gameId, studentName) {
        return `<tr style="opacity: 0.6; background-color: rgba(15, 23, 42, 0.5);">
            <td style="color:#64748b;">-</td>
            <td style="color:#64748b;">${gameId}</td>
            <td style="font-size: 16px; font-weight: bold; color: #94a3b8;">${studentName}</td>
            <td colspan="2"><span style="color:#ef4444; font-weight:bold; font-size:14px;">❌ Не виконав</span></td>
        </tr>`;
    }

    function loadReports() {
        const studentQ = document.getElementById('search-student').value.trim().toLowerCase();
        const gameQ = document.getElementById('search-game').value.trim().toLowerCase();
        const filterId = document.getElementById('report-category').value;
        const output = document.getElementById('reports-output');

        output.innerHTML = "<p style='text-align:center; color: #38bdf8;'>Завантаження даних...</p>";

        db.ref('homework_reports').once('value').then(snapshot => {
            const allData = snapshot.val() || {};
            let html = `<table>
                <thead>
                    <tr>
                        <th>Дата та Час</th>
                        <th>Гра (Натисни для перевірки)</th>
                        <th>Ім'я учня</th>
                        <th>Результат</th>
                        <th>Дії</th>
                    </tr>
                </thead>
                <tbody>`;
            let resultCount = 0;

            // Будуємо список учнів, яких ми очікуємо (для пошуку "лінтяїв")
            let roster = [];
            if (filterId === 'all') {
                Object.keys(classesData).sort((a,b) => classesData[a].name.localeCompare(classesData[b].name)).forEach(classId => {
                    const cName = classesData[classId].name;
                    if (studentsData[classId]) {
                        Object.values(studentsData[classId]).sort((a,b) => a.localeCompare(b)).forEach(sName => { roster.push({ name: sName, category: classId, categoryName: cName }); });
                    }
                });
                if (studentsData.individual) {
                    Object.values(studentsData.individual).sort((a,b) => a.localeCompare(b)).forEach(sName => { roster.push({ name: sName, category: 'individual', categoryName: 'Індивідуальні' }); });
                }
            } else {
                let cName = filterId === 'individual' ? 'Індивідуальні' : classesData[filterId]?.name;
                if (studentsData[filterId]) {
                    Object.values(studentsData[filterId]).sort((a,b) => a.localeCompare(b)).forEach(sName => { roster.push({ name: sName, category: filterId, categoryName: cName }); });
                }
            }

            if (studentQ) roster = roster.filter(s => s.name.toLowerCase().includes(studentQ));

            // Збираємо всі виконані роботи в один масив
            let submissions = [];
            for (const month in allData) {
                for (const date in allData[month]) {
                    for (const gameId in allData[month][date]) {
                        for (const studentName in allData[month][date][gameId]) {
                            submissions.push({ month, date, gameId, studentName, report: allData[month][date][gameId][studentName] });
                        }
                    }
                }
            }

            // Якщо ви шукаєте конкретну гру - виводимо весь клас і показуємо, хто зробив, а хто "лінтяй"
            if (gameQ !== "") {
                let gameSubmissions = submissions.filter(s => s.gameId.toLowerCase().includes(gameQ));
                let matchedGameIds = [...new Set(gameSubmissions.map(s => s.gameId))];
                if (matchedGameIds.length === 0) matchedGameIds = [document.getElementById('search-game').value.trim()];

                matchedGameIds.forEach(targetGameId => {
                    html += `<tr><td colspan="5" class="group-header" style="background:#334155; color:#38bdf8; text-align:center; font-size:18px;">Гра: ${targetGameId}</td></tr>`;
                    
                    let currentCategory = null;
                    let processedGuests = new Set();
                    
                    roster.forEach(student => {
                        if (currentCategory !== student.category) {
                            html += `<tr><td colspan="5" style="background:#1e293b; color:#94a3b8; font-weight:bold; font-size:14px; padding: 8px 15px;">📁 ${student.categoryName}</td></tr>`;
                            currentCategory = student.category;
                        }
                        
                        let sub = gameSubmissions.find(s => s.studentName === student.name && s.gameId === targetGameId);
                        if (sub) {
                            html += buildRow(sub.date, targetGameId, student.name, sub.report, sub.month, false);
                            processedGuests.add(student.name);
                            resultCount++;
                        } else {
                            html += buildMissingRow(targetGameId, student.name);
                            resultCount++;
                        }
                    });
                    
                    // Додаємо Гостей, які грали в цю гру, але не закріплені за класом
                    let guests = gameSubmissions.filter(s => s.gameId === targetGameId && !processedGuests.has(s.studentName) && (!studentQ || s.studentName.toLowerCase().includes(studentQ)));
                    if (guests.length > 0) {
                        html += `<tr><td colspan="5" style="background:#b45309; color:#fff; font-weight:bold; font-size:14px; padding: 8px 15px;">🕵️ Гості / Поза списком</td></tr>`;
                        guests.forEach(g => { html += buildRow(g.date, targetGameId, g.studentName, g.report, g.month, true); resultCount++; });
                    }
                });
            } else {
                // Якщо гру не введено - виводимо просто всі виконані роботи за фільтром
                let validNames = new Set(roster.map(s => s.name));
                let filteredSubs = submissions.filter(s => {
                    if (studentQ && !s.studentName.toLowerCase().includes(studentQ)) return false;
                    if (filterId !== 'all' && !validNames.has(s.studentName)) return false;
                    return true;
                });
                
                filteredSubs.sort((a,b) => b.date.localeCompare(a.date)); // Найновіші зверху
                
                filteredSubs.forEach(sub => {
                    let isGuest = !roster.some(r => r.name === sub.studentName);
                    html += buildRow(sub.date, sub.gameId, sub.studentName, sub.report, sub.month, isGuest);
                    resultCount++;
                });
            }

            if (resultCount === 0) {
                html += `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:20px;">За вашим запитом нічого не знайдено.</td></tr>`;
            }
            html += `</tbody></table>`;
            output.innerHTML = html;
        });
    }

    function deleteReportRecord(month, date, gameId, studentName) {
        if (confirm(`Ви впевнені, що хочете видалити роботу учня "${studentName}" за гру "${gameId}"?`)) {
            db.ref(`homework_reports/${month}/${date}/${gameId}/${studentName}`).remove().then(() => {
                loadReports();
            }).catch(err => alert("Помилка: " + err.message));
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    loadSchoolData();
</script>
</body>
</html>
